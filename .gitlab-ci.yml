# GitLab CI pipeline for Koda (the CNRS GitLab).
#
# Stages:
#   test   — lint, format check and unit tests
#   build  — build the web Docker image and push it to the Koda container registry
#
# Koda runners execute CI jobs; they do not host long-lived services. The image
# produced here is meant to be deployed on a runtime host (a lab/CC-IN2P3 VM, or
# a free PaaS such as Hugging Face Spaces). See docs/deployment.md.

stages:
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Koda runners only allow images from the CNRS dependency proxy or the
# bin.koda.cnrs.fr/docker-ci whitelist. Bare Docker Hub images are rejected.
default:
  image: bin.koda.cnrs.fr/docker-ci/python:3.12-slim

# ---------------------------------------------------------------------------
# Test
# ---------------------------------------------------------------------------

test:
  stage: test
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev,web]"
  script:
    - ruff check src web tests benchmarks
    - black --check src web tests benchmarks
    - pytest tests/ -q
  cache:
    key: pip
    paths:
      - .cache/pip

# ---------------------------------------------------------------------------
# Build the container image and push it to the Koda registry
# ---------------------------------------------------------------------------

build-image:
  stage: build
  # docker/dind are not on the Koda runner whitelist; podman is.
  image: bin.koda.cnrs.fr/docker-ci/podman/stable
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    # Koda runners do not inject CI_REGISTRY, so hardcode the registry.
    # Verified: https://src.koda.cnrs.fr/v2/ returns 401 (registry present);
    # the :4567 port does not exist.
    REGISTRY: "src.koda.cnrs.fr"
    IMAGE: "src.koda.cnrs.fr/i3s-research/amine"
  before_script:
    - echo "Registry=$REGISTRY Image=$IMAGE"
    - test -n "$DOCKER_AUTH_CONFIG" && echo "DOCKER_AUTH_CONFIG is present" || echo "DOCKER_AUTH_CONFIG is absent"
    # Use one podman auth file: seed it with the runner-provided credentials
    # (needed to pull the base image from bin.koda.cnrs.fr) and then add the
    # project registry login (needed to push the built image).
    - export REGISTRY_AUTH_FILE="$CI_PROJECT_DIR/.containers-auth.json"
    - if [ -n "$DOCKER_AUTH_CONFIG" ] && [ -f "$DOCKER_AUTH_CONFIG" ]; then cp "$DOCKER_AUTH_CONFIG" "$REGISTRY_AUTH_FILE"; fi
    - if [ -n "$DOCKER_AUTH_CONFIG" ] && [ ! -f "$DOCKER_AUTH_CONFIG" ]; then printf '%s' "$DOCKER_AUTH_CONFIG" > "$REGISTRY_AUTH_FILE"; fi
    - if [ -z "$DOCKER_AUTH_CONFIG" ]; then printf '{"auths":{}}' > "$REGISTRY_AUTH_FILE"; fi
    - if [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ]; then
        podman login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$REGISTRY";
      else
        echo "No registry credentials provided; skipping login";
      fi
  script:
    # AMINE_SPECIES is empty: the Koda runner's proxy blocks string-db.org,
    # so the STRING data is downloaded at runtime instead of build time.
    - podman build
        --build-arg BASE_IMAGE="bin.koda.cnrs.fr/docker-ci/python:3.12-slim"
        --build-arg AMINE_SPECIES=""
        -t "$IMAGE:$CI_COMMIT_SHORT_SHA"
        -t "$IMAGE:latest" .
    - podman push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - podman push "$IMAGE:latest"
