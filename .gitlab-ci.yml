# GitLab CI pipeline for Koda (the CNRS GitLab).
#
# Stages:
#   test   — lint, format check and unit tests
#   build  — build the web Docker image and push it to the Koda container registry
#
# Koda runners execute CI jobs; they do not host long-lived services. The image
# produced here is meant to be deployed on a runtime host (a lab/CC-IN2P3 VM, or
# a free PaaS such as Hugging Face Spaces). See docs/deployment.md.

stages:
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  image: python:3.12-slim

# ---------------------------------------------------------------------------
# Test
# ---------------------------------------------------------------------------

test:
  stage: test
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev,web]"
  script:
    - ruff check src web tests benchmarks
    - black --check src web tests benchmarks
    - pytest tests/ -q
  cache:
    key: pip
    paths:
      - .cache/pip

# ---------------------------------------------------------------------------
# Build the container image and push it to the Koda registry
# ---------------------------------------------------------------------------

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build
        --build-arg AMINE_SPECIES="human"
        -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
