name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      - name: Lint (ruff)
        run: ruff check src web tests benchmarks

      - name: Format check (black)
        run: black --check src web tests benchmarks

      - name: Run tests
        run: pytest tests/ -q --cov=amine --cov-report=term-missing

  docker:
    name: Build web image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (root Dockerfile)
        run: docker build -t amine-web:ci .
      - name: Build Docker image (web/Dockerfile)
        run: docker build -f web/Dockerfile -t amine-web:ci-web .
